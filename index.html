ody:["The basic loop: sign or shortlist wrestlers, book a show, run it, repeat. Every show advances one week.","You start small — an Unknown-tier promotion with £20,000 and no reputation, based in one city you choose yourself. Venues, loans, and everything else scale up as your company grows through Local, Regional, National, and finally International.","There's no single win condition — this is a long-term management sim. The closest thing to a fail state is going bankrupt for 4 weeks straight, which gets you fired and ends that playthrough (it's archived under Menu > Saves > Previous Games, alongside any promotion you retire on your own terms)."]},{key:"company",title:"Company Tab",icon:fi,body:["Overview: your company name and booker name (read-only here — edit both under Menu > Back Office), plus key totals — funds, roster size, average roster ability, shows run, titles owned.","Finance: a graph of your bank balance across the current in-game year, with a year selector once you've played long enough to have more than one, and your loan status right underneath it.","Company Level (shown top-right, tap it for a city breakdown) is your overall reputation — Unknown, Local, Regional, National, International. It's driven by how well your shows go in each city you actually tour, and it gets harder to keep climbing the higher it gets."]},{key:"roster",title:"Roster, Wrestlers & Contracts",icon:pc,body:["There are two ways to use a wrestler: sign them Exclusive (a standing weekly wage, guaranteed available, no per-appearance fee) or add them to your Per-Use list (free to add, but you negotiate a fee — Low/Medium/High offer, cheaper offers are more likely refused — and pay it each time you actually book them). Per-use is cheaper per appearance, but exclusive guarantees you'll never lose access to them.","A wrestler's Overall stat is fixed ability — it never changes from booking decisions. Push (their card status, from Jobber up to Legend) is separate and yours to set for anyone signed to you, exclusive or per-use — a skilled worker can be booked as a jobber, and nobody becomes a Legend just from good stats alone. Same goes for Alignment and renaming: editable for your own people, read-only for anyone signed elsewhere.","Wrestlers age in real time — every 52 weeks, everyone gets a year older. Past 35 there's a real chance of small permanent dips to their physical stats; past 30, experience can show up as a charisma or mic-skill bump instead. A win also has a small chance of a tiny permanent boost tied to how it was won.","Every wrestler also has Draw Power — how much they actually pull a crowd, separate from in-ring ability. It grows from winning, good matches, and title moments, and fades slowly if they're never booked anywhere. Who you put in the Main Event can swing a show's attendance up to ±25%.","Any offer might get turned down — if refused, they're off-limits to you for 1-3 weeks before you can try again. Releasing an Exclusive wrestler mid-contract also costs a buyout, 50% of their remaining contract wage, shown before you confirm.","Wrestlers have Energy (drains with use, recovers when rested — low energy hurts both their win chance and the match rating, but never permanently affects their Overall) and Happiness (affected by requests you promise and then fulfil, break, or decline, plus wins, losses, injuries, and title changes). Watch the Requests tab under Roster for what your talent is asking for.","Injuries can happen after a draining match, sidelining someone 3-52 weeks with a specific injury type (knee, back, concussion, and others) — including champions, who are forced to vacate their title if it happens to them."]},{key:"booking",title:"Booking a Show",icon:xO,body:["Pick a venue (locked by your company tier — Backyard is always open, Major Arena needs International), a city, and a ticket price. Higher prices mean fewer fans, and your reputation in that specific city sets the ceiling.","You start in one city of your choosing and nowhere else. Get any city you can already book to 70% local popularity and the next roughly-nearby group of cities unlocks — International stays gated separately, behind company tier.","Build your card as a running order of matches and segments against a time budget set by your venue (Backyard gives you 30 minutes, Major Arena 90). Position matters more than anything else — later on the card means a higher rating ceiling, so a top star wasted in an early segment still can't out-rate your Main Event — and minutes allocated matter too, within that ceiling. Each segment resolves the moment it's fully booked, so you'll see the result right away rather than waiting for the whole show. Once you're National tier or above, leaving a big chunk of your time budget unused costs you real rating and money — fans at that level expect a full card.","Match types: 1v1, 2v2 tag (tag teams from a stable get their opponent list filtered to stablemates automatically), Triple Threat, Fatal 4-Way, or a Segment (a promo — rated on charisma, no winner or energy cost, and you can aim it at another signed wrestler to nudge or spark a rivalry).","Every match resolves with a method — Pinfall, Submission, Disqualification, or Countout — weighted by the winning side's stats.","Booking the exact same matchup over and over gets a real, escalating rating penalty as fans get tired of seeing it — shown as a warning before you run the show. An active rivalry gets that penalty halved, since building toward a blowoff is a real reason to run it back.","Speciality Matches (No DQ, Cage, Ladder, and more) are gated by your company level and cost extra, but boost the rating ceiling and let a wrestler's Specialty-type stat swing the outcome, not just their overall rating.","A Face vs Heel matchup gets a small rating bump for the contrast — booking two of the same alignment against each other is a flatter match."]},{key:"titles",title:"Titles & Rankings",icon:Sn,body:["You start with one title and can buy up to 5 more (£25,000 each) as Singles or Tag Team, optionally locked to a weight class or gender.","Once a title has a champion, only a top-3 ranked contender (from your own roster, exclusive or per-use) can challenge for it — vacant titles are open to anyone. Multi-man matches are exempt from the contender rule, since a scramble is a scramble.","A champion who goes 8 shows without defending gets automatically vacated, with a small prestige hit — the Titles tab warns you once you're within 3 weeks of that happening.","Prestige builds from defenses and match quality, but a reign that ends with zero defenses takes a real hit — win it and immediately drop it, and it counts as a fluke, not a real reign.","Rankings (its own tab) shows the top 10 by ranking points, singles or tag, filterable by promotion. Ranking points decay slowly if a wrestler sits out or is injured, and are capped so a long unbeaten streak can't snowball forever."]},{key:"tagteams",title:"Tag Teams & Rivalries",icon:Lu,body:["Build a stable of up to 5 wrestlers under Roster — the first two you add become the core tag team, tracking their own win-loss record and eligible for tag titles. The same page under Menu > Wrestlers shows every stable in the game, not just yours.","Rivalries form naturally from locker-room news, or you can create one manually (singles or tag), or spark one with a promo aimed at someone. Every rivalry has a visible stage — Just Introduced, Escalating, or Ready to Blow Off — with a hint on what to book next. Booking two rivals against each other boosts the match rating, and a long enough feud can blow off into a bigger payoff."]},{key:"promotions",title:"Promotions (Rivals)",icon:cc,body:["Eight fictional rival companies compete alongside you — they hire, fire, crown champions, run their own simulated shows with the same ability-driven match ratings you get, and their popularity rises and falls independently. Tap any of them for a closer look at their roster, champion, and tag teams.","Freelancers aren't exclusive to anyone — the same wrestler could realistically get booked by a rival the same week you're eyeing them, so they're not always guaranteed available."]},{key:"merch",title:"Merchandise",icon:Hr,body:["Unlocks once your company score hits 15 — its own page under Menu. Buy stock in bulk upfront; it persists between shows and sells down over time rather than being a fresh spend every week.","How much sells at any given show depends on attendance, how established you are in that city, and how good the show is. Run out of stock and you'll miss sales — check back and restock rather than treating it as fire-and-forget. There's also a small chance of theft eating into whatever's left unsold overnight.","A one-time, permanent quality upgrade (Premium, then Deluxe) raises both the cost and the sale price per unit — a genuine milestone purchase, not a small tweak.","Revenue gets attributed to the wrestlers who were actually on the card, weighted by their Draw Power, so you can see who's actually moving merchandise on the Merchandise page itself."]},{key:"deals",title:"TV Networks & Sponsors",icon:Rm,body:["Once you're reputable enough (nothing is available at Unknown), networks and sponsors will start making offers. A network deal pays per estimated viewer and also gives a small ongoing popularity boost; a sponsor is money only.","Offers refresh periodically when you don't have an active deal — check the Deals tab regularly."]},{key:"finance",title:"Finance & Loans",icon:Tm,body:["A loan is flat 20% interest, repaid automatically out of profit every week for the term you choose. Bigger loans need more reputation to qualify for, same as venues. Found under Company > Finance, right below your bank balance chart.","Rarely, a random financial disaster can hit — 20-60% of your funds gone in one week. It's uncommon by design, but it's there, and it gets more likely to matter the more you've built up.","Having no exclusive roster at all is its own quiet penalty once you're past Unknown tier — growth slows until you sign someone. Once you've got 5+ exclusive signings, their average ability relative to what's expected at your company level speeds up or slows down growth from there."]},{key:"news",title:"News",icon:Mm,body:["Everything happening across the wrestling world — your title changes, rival hires and crownings, injuries, and locker-room rumours (friendships, rivalries, relationships) — lands here. The most recent item also shows as a small icon in the header with a red dot, so you don't have to go looking for it.","Filter by promotion, year, or week to cut through the noise once you've been playing a while."]},{key:"achievements",title:"Achievements & Hall of Fame",icon:$u,body:["Achievements (Menu > Achievements) are lifetime — 37 of them, covering company growth, roster building, finance, titles, merchandise, and more. They persist even if you retire and start a fresh promotion; only a full progress wipe clears them.","Hall of Fame (Menu > Hall of Fame) tracks your best-ever match, biggest-ever show, and longest-ever title reign — and shows the best any rival has ever managed in each, side by side, so you can see if anyone's actually beaten you."]},{key:"backoffice",title:"Back Office & Saving",icon:nh,body:["Back Office (Menu) is where your company name and your own promoter name, age, and sex are edited — kept separate from the day-to-day screens since they're not something you're changing often.","Saves (Menu) has one manual save button plus an automatic save that updates after every show as a safety net — no more juggling numbered slots.","Retire (under Saves) ends your current run on your own terms, files it under Previous Games same as getting fired, and starts you fresh with a new home city to choose. Reset Full Progress, in the same place, wipes everything — including lifetime Achievements and Hall of Fame — and can't be undone."]}],rq=[{title:"General",items:[{key:"company",label:"Off
