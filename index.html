scale up as your company grows through Local, Regional, National, and finally Global.","There's no single win condition — this is a long-term management sim. The closest thing to a fail state is going bankrupt for 4 weeks straight, which gets you fired and ends that playthrough (it's archived under Menu > Saves > Previous Games, alongside any promotion you retire on your own terms)."]},{key:"company",title:"Company Tab",icon:Pi,body:["Overview: your company name and booker name (read-only here — edit both under Menu > Back Office), plus key totals — funds, roster size, average roster ability, shows run, titles owned.","Finance: a graph of your bank balance across the current in-game year, with a year selector once you've played long enough to have more than one, and your loan status right underneath it.","Company Level (shown top-right, tap it for a city breakdown) is your overall reputation — Unknown, Local, Regional, National, Global. It's driven by how well your shows go in each city you actually tour, and it gets harder to keep climbing the higher it gets."]},{key:"roster",title:"Roster, Wrestlers & Contracts",icon:ul,body:["There are two ways to use a wrestler: sign them Exclusive (a standing weekly wage, guaranteed available, no per-appearance fee) or add them to your Per-Use list (free to add, but you negotiate a fee — Lowball/Standard/Generous offer, cheaper offers are more likely refused — and pay it each time you actually book them). Per-use is cheaper per appearance, but exclusive guarantees you'll never lose access to them. Either kind of offer can also come back as a counteroffer instead of a flat no — accept their number or walk away — and your odds of a yes depend on your own company's reputation as well as their mood: a name right at the top of what you're allowed to approach is always a harder sell than one comfortably within your reach.",`Star a wrestler from the Wrestlers list to add them to your Shortlist (filter for "Shortlisted only" to see just them, whoever they're signed to right now) — a running watchlist for names you're building toward, not just who's available this week. The Wrestlers tab also surfaces a "Who To Chase Next" panel of the best free agents currently within your reach.`,"A wrestler's Overall stat is fixed ability — it never changes from booking decisions. Push (their card status, from Jobber up to Legend) is separate and yours to set for anyone signed to you, exclusive or per-use — a skilled worker can be booked as a jobber, and nobody becomes a Legend just from good stats alone. Same goes for Alignment and renaming: editable for your own people, read-only for anyone signed elsewhere.","Wrestlers age in real time — every 52 weeks, everyone gets a year older. Past 35 there's a real chance of small permanent dips to their physical stats; past 30, experience can show up as a charisma or mic-skill bump instead. A win also has a small chance of a tiny permanent boost tied to how it was won.","Every wrestler also has Draw Power — how much they actually pull a crowd, separate from in-ring ability. It grows from winning, good matches, and title moments, and fades slowly if they're never booked anywhere. Who you put in the Main Event can swing a show's attendance up to ±25%.","Any offer might get turned down — if refused, they're off-limits to you for 1-3 weeks before you can try again. Releasing an Exclusive wrestler mid-contract also costs a buyout, 50% of their remaining contract wage, shown before you confirm.","Wrestlers have Energy (drains with use, recovers when rested — low energy hurts both their win chance and the match rating, but never permanently affects their Overall) and Happiness (affected by requests you promise and then fulfil, break, or decline, plus wins, losses, injuries, and title changes). Watch the Requests tab under Roster for what your talent is asking for.","Injuries can happen after a draining match, sidelining someone 3-52 weeks with a specific injury type (knee, back, concussion, and others) — including champions, who are forced to vacate their title if it happens to them.","Some retirees leave a legacy — a kid who grows up around the business and debuts as a free agent 15-20 years later, carrying the family name. You won't see it happen when it's rolled, only when the kid actually shows up in the News — their Potential is pulled toward how good the parent really was at their peak, not whatever they'd declined to by retirement, so a legendary career can genuinely pay off a generation later.","A wrestler's detail screen can show Traits — tags earned from who they've actually become over their career, not rolled at creation: Fan Favorite (high draw power, and it keeps snowballing), Workhorse (serious ring-time logged), Flight Risk (unhappy right now), Locker Room Leader (happy and experienced), Clutch Performer (a strong win rate plus a title reign — gets a small rating bump specifically in title matches and the Main Event), Rising Star (young with real room left against their Potential), and Second Generation (a legacy debut). Nothing to manage here — they just read as a snapshot of the career so far."]},{key:"staff",title:"Staff",icon:gg,body:["Staff (Menu) covers seven behind-the-scenes roles, each hired straight from a standing candidate pool — no bidding against yourself, just pick a candidate and offer a contract. Agent, Referee, and Assistant Booker all raise the ceiling your matches can realistically hit; Medical Staff cuts injury odds and shortens recovery; Ring Crew reduces the odds of a general company catastrophe (lawsuits, tax audits, scandals); Security does the same for crowd and venue incidents specifically (fights, barrier jumps, backstage breaches); Trainer speeds up how fast Developmental prospects close the gap to their potential. Only your single best hire per role counts — a second Agent doesn't stack with the first.","Rivals aren't just sitting there — every non-acquired rival company competes for the exact same candidate pool, hiring and occasionally losing staff of their own over time. Anyone a rival's already snapped up shows up greyed out in your Candidates list rather than just vanishing, so you can see the competition for talent happening."]},{key:"booking",title:"Booking a Show",icon:B_,body:["Level, venue, city, length, and cadence are all set up once on Calendar · Show Events — Book just shows what's due that week and lets you set the ticket price, build the card, and run it. Higher prices mean fewer fans, and your reputation in that specific city sets the ceiling.","You start in one city of your choosing and nowhere else. Get any city you can already book to 70% local popularity and the next roughly-nearby group of cities unlocks. Touring abroad (New York, Mexico City, Tokyo) is gated separately, behind reaching National company tier — a venue is also locked by company tier on top of that (Backyard is always open, Major Arena needs Global).","Build your card as a running order of matches and segments against a time budget set by your venue (Backyard gives you 30 minutes, Major Arena 90). Position matters more than anything else — later on the card means a higher rating ceiling, so a top star wasted in an early segment still can't out-rate your Main Event — and minutes allocated matter too, within that ceiling. Each segment resolves the moment it's fully booked, so you'll see the result right away rather than waiting for the whole show. Once you're National tier or above, leaving a big chunk of your time budget unused costs you real rating and money — fans at that level expect a full card.","Match types: 1v1, 2v2 tag (tag teams from a stable get their opponent list filtered to stablemates automatically), Triple Threat, or Fatal 4-Way — plus three kinds of Angle, none of which have a winner/loser or cost energy: a Promo (solo mic work, rated on charisma, aim it at someone to nudge or spark a rivalry), a Confrontation (two people face to face, rated on both their charisma, with a real chance of boiling over into a physical swerve — a much bigger rivalry swing than a plain promo), or a Vignette (solo atmosphere-building rated on entertainment instead of charisma, no subject).","Every match resolves with a method — Pinfall, Submission, Disqualification, or Countout — weighted by the winning side's stats.","Booking the exact same matchup over and over gets a real, escalating rating penalty as fans get tired of seeing it — shown as a warning before you run the show. An active rivalry gets that penalty halved, since building toward a blowoff is a real reason to run it back.","Speciality Matches (No DQ, Cage, Ladder, and more) are gated by your company level and cost extra, but boost the rating ceiling and let a wrestler's Specialty-type stat swing the outcome, not just their overall rating.","A Face vs Heel matchup gets a small rating bump for the contrast — booking two of the same alignment against each other is a flatter match.","Pre-show and post-show dark matches (up to 3 each, also on the Book page) sit entirely outside the card — no time budget, no effect on the show rating, no wins/losses on anyone's record. They're just reps: a small chance of a permanent stat bump, and ring time that counts toward Developmental training for anyone not otherwise on the card.","Advertising (Book page, picked fresh for each scheduled show) spends money up front for a real boost to that show's attendance and how much it grows the city's popularity — Posters & Flyers, a TV Spot, or a Social Media Blitz, each pricier and stronger than the last.","What the wrestling world wants shifts every few months — shown on the Book page and your Company tab. Anything that actually fits the current trend (a Speciality Match during a Hardcore phase, an all-Cruiserweight match during High-Flying, an Angle during Sports Entertainment, and so on) gets a flat rating bonus, so the same card shape isn't always the optimal one to book."]},{key:"titles",title:"Titles & Rankings",icon:xn,body:["You start with one title and can buy up to 5 more (£25,000 each) as Singles or Tag Team, optionally locked to a weight class or gender.","Once a title has a champion, only a top-3 ranked contender (from your own roster, exclusive or per-use) can challenge for it — vacant titles are open to anyone. Multi-man matches are exempt from the contender rule, since a scramble is a scramble.","A champion who goes 8 shows without defending gets automatically vacated, with a small prestige hit — the Titles tab warns you once you're within 3 weeks of that happening.","Prestige builds from defenses and match quality, but a reign that ends with zero defenses takes a real hit — win it and immediately drop it, and it counts as a fluke, not a real reign.","Rankings (its own tab) shows the top 10 by ranking points, singles or tag, filterable by promotion. Ranking points decay slowly if a wrestler sits out or is injured, and are capped so a long unbeaten streak can't snowball forever."]},{key:"tagteams",title:"Tag Teams & Rivalries",icon:nd,body:["Build a stable of up to 5 wrestlers under Roster — the first two you add become the core tag team, tracking their own win-loss record and eligible for tag titles. The same page under Menu > Wrestlers shows every stable in the game, not just yours.","Rivalries form naturally from locker-room news, or you can create one manually (singles or tag), or spark one with a promo aimed at someone. Every rivalry has a visible stage — Just Introduced, Escalating, or Ready to Blow Off — with a hint on what to book next. Booking two rivals against each other boosts the match rating, and a long enough feud can blow off into a bigger payoff."]},{key:"promotions",title:"Promotions (Rivals)",icon:wc,body:["Eight fictional rival companies compete alongside you — they hire, fire, crown champions, run their own simulated shows with the same ability-driven match ratings you get, and their popularity rises and falls independently. Tap any of them for a closer look at their roster, champion, and tag teams.","Freelancers aren't exclusive to anyone — the same wrestler could realistically get booked by a rival the same week you're eyeing them, so they're not always guaranteed available.","A Working Agreement (available once a rival's within one tier of you) opens up their signed roster as guest talent on your own shows — not free, but a discounted loan fee well below a normal per-use rate. Either side can end it at any time."]},{key:"merch",title:"Merchandise",icon:ia,body:["Unlocks once your company score hits 15 — its own page under Menu. Buy stock in bulk upfront; it persists between shows and sells down over time rather than being a fresh spend every week.","How much sells at any given show depends on attendance, how established you are in that city, and how good the show is. Run out of stock and you'll miss sales — check back and restock rather than treating it as fire-and-forget. There's also a small chance of theft eating into whatever's left unsold overnight.","A one-time, permanent quality upgrade (Premium, then Deluxe) raises both the cost and the sale price per unit — a genuine milestone purchase, not a small tweak.","Revenue gets attributed to the wrestlers who were actually on the card, weighted by their Draw Power, so you can see who's actually moving merchandise on the Merchandise page itself."]},{key:"deals",title:"TV Networks & Sponsors",icon:yg,body:["Once you're reputable enough (nothing is available at Unknown), networks and sponsors will start making offers. A network deal pays per estimated viewer and also gives a small ongoing popularity boost; a sponsor is money only.","A bigger Production tier (Back Office) makes your broadcast itself worth more — it multiplies what a network actually pays per viewer, on top of whatever the raw viewer count already is.","Offers refresh periodically when you don't have an active deal — check the Deals tab regularly."]},{key:"finance",title:"Finance & Loans",icon:mg,body:["A loan is flat 20% interest, repaid automatically out of profit every week for the term you choose. Bigger loans need more reputation to qualify for, same as venues. Found under Company > Finance, right below your bank balance chart.","Rarely, a random financial disaster can hit — 20-60% of your funds gone in one week. It's uncommon by design, but it's there, and it gets more likely to matter the more you've built up.","Having no exclusive roster at all is its own quiet penalty once you're past Unknown tier — growth slows until you sign someone. Once you've got 5+ exclusive signings, their average ability relative to what's expected at your company level speeds up or slows down growth from there."]},{key:"news",title:"News",icon:vg,body:["Everything happening across the wrestling world — your title changes, rival hires and crownings, injuries, and locker-room rumours (friendships, rivalries, relationships) — lands here. The most recent item also shows as a small icon in the header with a red dot, so you don't have to go looking for it.","Filter by promotion, year, or week to cut through the noise once you've been playing a while."]},{key:"achievements",title:"Achievements & Hall of Fame",icon:il,body:["Achievements (Menu > Achievements) are lifetime — 37 of them, covering company growth, roster building, finance, titles, merchandise, and more. They persist even if you retire and start a fresh promotion; only a full progress wipe clears them.","Hall of Fame (Menu > Hall of Fame) tracks your best-ever match, biggest-ever show, and longest-ever title reign — and shows the best any rival has ever managed in each, side by side, so you can see if anyone's actually beaten you."]},{key:"backoffice",title:"Back Office & Saving",icon:wh,body:["Back Office (Menu) is where your company name and your own promoter name, age, and sex are edited — kept separate from the day-to-day screens since they're not something you're changing often. It's also where you found a Developmental feeder promotion and upgrade Production (pyro, titantron, lighting, cameras) — both one-time capital investments.","Saves (Menu) has one manual save button plus an automatic save that updates after every show as a safety net — no more juggling numbered slots.","Retire (under Saves) ends your current run on your own terms, files it under Previous Games same as getting fired, and starts you fresh with a new home city to choose. Reset Full Progress, in the same place, wipes everything — including lifetime Achievements and Hall of Fame — and can't be undone."]}],zU=[{title:"General",items:[{key:"company",label:"Office",icon:Pi},{key:"news",label:"News",icon:vg},{key:"guide",label:"Guide",icon:tB}]},{title:"World",items:[{key:"promotions",label:"Promotions",icon:wc},{key:"rankings",label:"Rankings",icon:aB},{key:"wrestlers",label:"Wrestlers",icon:fd}]},{title:"Your Promotion",items:[{key:"roster",label:"Roster",icon:ul},{key:"staff",label:"Staff",icon:gg},{key:"storylines",label:"Storylines",icon:fo},{key:"book",label:"Book",icon:ia},{key:"calendar",label:"Calendar",icon:Ah},{key:"titles",label:"Titles",icon:xn},{key:"deals",label:"Deals",icon:yg},{key:"merch",label:"Merchandise",icon:ia},{key:"achievements",label:"Achievements",icon:il},{key:"halloffame",label:"Hall of Fame",icon:Bn},{key:"backoffice",label:"Back Office",icon:Pi},{key:"saves",label:"Saves",icon:wh}]}];function UU(){var eh,Xr;const[e,t]=L.useState(2e4),[n,r]=L.useState(null),[i,l]=L.useState([]),[u,f]=L.useState(null),[h,m]=L.useState([]),[v,g]=L.useState(0),[b,S]=L.useState(null),[C,k]=L.useState([]),[j,A]=L.useState(void 0),[_,M]=L.useState(void 0),[P,E]=L.useState(!1),[B,I]=L.useState([]),[W,q]=L.useState({bestMatch:null,biggestShow:null,longestReign:null,bestMatchRival:null,biggestShowRival:null,longestReignRival:null}),[Y,X]=L.useState({}),[V,ie]=L.useState(!1),[se,oe]=L.useState(!1),[ue,pe]=L.useState(!1),[re,fe]=L.useState(!1),[ce,U]=L.useState(!1),[Z,Se]=L.useSta
